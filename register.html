<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ultimate SEO Meta Tags -->
    <meta name="description" content="ClassMate Classes & Courses - The best place to learn programming, high-load architecture, FAANG DSA, and full-stack development. Join ClassMate Courses today.">
    <meta name="keywords" content="classmate classes, classmate courses, programming classes, advanced coding courses, classmate learning, software engineering, DSA, classmate">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ClassMate - Elite Classes & Courses">
    <meta property="og:description" content="Master high-level programming with ClassMate Classes. We offer premium courses in web development, AI, and systems architecture.">
    <meta property="og:image" content="https://classmates.kesug.com/classmate.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="ClassMate - Elite Classes & Courses">
    <meta property="twitter:description" content="Master high-level programming with ClassMate Classes. We offer premium courses in web development, AI, and systems architecture.">
    <meta property="twitter:image" content="https://classmates.kesug.com/classmate.png">

    <!-- Schema Markup (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "ClassMate",
      "logo": "https://classmates.kesug.com/classmate.png",
      "description": "Premium classmate classes and classmate courses for modern software engineering.",
      "sameAs": []
    }
    </script>
    <title>ClassMate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="login-container">
        <div class="popup-header">
            <img src="classmate.png" alt="ClassMate Logo" class="popup-logo">
            <h2 class="popup-greeting"><span class="text-black">Register</span> <span class="text-yellow">Now</span></h2>
        </div>
        <form id="registerForm">
            <input type="text" id="regUsername" placeholder="Username" required>
            <input type="tel" id="regPhone" placeholder="Phone Number" value="+91" pattern="^\+91[0-9]{10}$" maxlength="13" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="4-digit PIN" pattern="[0-9]{4}" maxlength="4" required>
            <input type="password" id="regConfirmPassword" placeholder="Confirm 4-digit PIN" pattern="[0-9]{4}" maxlength="4" required>
            <button type="submit" class="login-btn">Register</button>
            <p class="register-link">Already have an account? <a href="login.html">Login Here</a></p>
        </form>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const registerForm = document.getElementById('registerForm');
            if (registerForm) {
                registerForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = document.getElementById('regUsername').value;
                    const phone = document.getElementById('regPhone').value;
                    const email = document.getElementById('regEmail').value;
                    const password = document.getElementById('regPassword').value;
                    const confirmPassword = document.getElementById('regConfirmPassword').value;

                    if (password !== confirmPassword) {
                        alert('Passwords do not match!');
                        return;
                    }

                    const students = JSON.parse(localStorage.getItem('registeredStudents')) || [];
                    const exists = students.find(s => s.username === username || s.email === email);
                    if (exists) {
                        alert('User with this username or email already exists!');
                        return;
                    }

                    students.push({ username, phone, email, password });
                    localStorage.setItem('registeredStudents', JSON.stringify(students));
                    
                    alert('Registration successful! You can now login.');
                    window.location.href = 'login.html';
                });
            }
        });
    </script>
</body>
</html>
