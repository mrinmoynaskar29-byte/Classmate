<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ultimate SEO Meta Tags -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="ClassMate - Elite Classes & Courses">

    <!-- Schema Markup (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "ClassMate",
      "logo": "https://classmates.kesug.com/classmate.png",
      "description": "Premium classmate classes and classmate courses for modern software engineering.",
      "sameAs": []

    <title>Admin Panel - Course Bookings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            color: #202124;
            min-height: 100vh;
            position: relative;
            background: transparent;
        }
        .admin-container {
            padding: 120px 4% 40px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .admin-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }
        .admin-header h1 {
            font-size: 48px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .admin-header p {
            font-size: 18px;
            color: #e2e8f0;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        
        /* Material You Tabs */
        .admin-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            animation: fadeInUp 0.5s ease-out;
        }
        .admin-tabs button {
            background: #e8eaed;
            color: #5f6368;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
        }
        /* Ripple effect */
        .admin-tabs button::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.3);
            width: 100%;
            height: 100%;
            top: 0;
            left: -100%;
            transform: skewX(-20deg);
            transition: all 0.5s;
        }
        .admin-tabs button:hover::after {
            left: 100%;
        }
        .admin-tabs button.active {
            background: #d3e3fd;
            color: #0b57d0;
            box-shadow: 0 4px 12px rgba(11, 87, 208, 0.15);
            transform: translateY(-2px);
        }
        .admin-tabs button:hover:not(.active) {
            background: #dadce0;
            transform: translateY(-1px);
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-bottom: 20px;
            animation: fadeIn 0.8s ease-out;
            flex-wrap: wrap;
        }
        #clearBookingsBtn, #clearStudentsBtn {
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Roboto', sans-serif;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
        }
        #clearBookingsBtn:hover, #clearStudentsBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4);
        }
        #downloadExcelBtn {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Roboto', sans-serif;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.3);
        }
        #downloadExcelBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.4);
        }

        /* Action Buttons inside Table */
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            transition: all 0.3s;
            margin-right: 8px;
            color: white;
            font-size: 13px;
        }
        .edit-btn {
            background: linear-gradient(45deg, #36D1DC, #5B86E5);
            box-shadow: 0 4px 10px rgba(91, 134, 229, 0.3);
        }
        .edit-btn:hover {
            transform: translateY(-2px);
        }
        .delete-btn {
            background: linear-gradient(45deg, #FF416C, #FF4B2B);
            box-shadow: 0 4px 10px rgba(255, 65, 108, 0.3);
        }
        .delete-btn:hover {
            transform: translateY(-2px);
        }

        /* Material You Table */
        .table-responsive {
            animation: fadeInUp 0.7s ease-out;
            overflow-x: auto;
        }
        .bookings-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            border-radius: 24px;
            overflow: hidden;
        }
        .bookings-table th, .bookings-table td {
            padding: 20px 24px;
            text-align: left;
            border-bottom: 1px solid #f1f3f4;
        }
        .bookings-table th {
            background: #f8f9fa;
            font-size: 14px;
            color: #5f6368;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .bookings-table td {
            color: #202124;
            font-size: 15px;
            vertical-align: middle;
        }
        .bookings-table tbody tr {
            transition: background 0.2s;
        }
        .bookings-table tbody tr:hover {
            background: #f8f9fa;
        }
        .bookings-table tr:last-child td {
            border-bottom: none;
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .transaction-image {
            max-width: 150px;
            max-height: 150px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .transaction-image:hover {
            transform: scale(2.5);
        }
    </style>
</head>
<body>
    <!-- 3D Live Color Animated Background from Skills page -->
    <div class="live-bg-container skills-live-bg">
        <div class="color-orb skills-orb-1"></div>
        <div class="color-orb skills-orb-2"></div>
        <div class="color-orb skills-orb-3"></div>
        <div class="color-orb skills-orb-4"></div>
        <div class="color-orb skills-orb-5"></div>
    </div>

    <!--Navigation Bar-->
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="classmate.png" alt="ClassMate Logo"></a>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Admin Dashboard</h1>
            <p>Manage all registered students and course bookings.</p>
        </div>
        
        <div class="admin-tabs">
            <button id="showStudentsBtn" class="active">Registered Students</button>
            <button id="showCoursesBtn">Registered Courses</button>
        </div>

        <!-- Registered Students Section -->
        <div id="studentsSection">
            <div class="controls">
                <button id="downloadExcelBtn"><i class="fas fa-file-excel"></i> Download Excel</button>
                <button id="clearStudentsBtn" title="This will delete all student records from this browser."><i class="fas fa-trash-alt"></i> Clear All Students</button>
            </div>
            <div class="table-responsive">
                <table class="bookings-table" id="studentsTable">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Password</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <!-- Student data will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Registered Courses Section -->
        <div id="coursesSection" style="display: none;">
            <div class="controls">
                <button id="clearBookingsBtn" title="This will delete all booking records from this browser."><i class="fas fa-trash-alt"></i> Clear All Bookings</button>
            </div>
            <div class="table-responsive">
                <table class="bookings-table">
                    <thead>
                        <tr>
                            <th>Full Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Transaction ID</th>
                            <th>Transaction Image</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <!-- Booking data will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="classmate.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const bookingsTableBody = document.getElementById('bookingsTableBody');
        const studentsTableBody = document.getElementById('studentsTableBody');
        const clearBookingsBtn = document.getElementById('clearBookingsBtn');
        const clearStudentsBtn = document.getElementById('clearStudentsBtn');
        
        const showStudentsBtn = document.getElementById('showStudentsBtn');
        const showCoursesBtn = document.getElementById('showCoursesBtn');
        const studentsSection = document.getElementById('studentsSection');
        const coursesSection = document.getElementById('coursesSection');

        // Tab Switching
        showStudentsBtn.addEventListener('click', () => {
            showStudentsBtn.classList.add('active');
            showCoursesBtn.classList.remove('active');
            studentsSection.style.display = 'block';
            coursesSection.style.display = 'none';
        });

        showCoursesBtn.addEventListener('click', () => {
            showCoursesBtn.classList.add('active');
            showStudentsBtn.classList.remove('active');
            coursesSection.style.display = 'block';
            studentsSection.style.display = 'none';
        });

        function loadBookings() {
            const bookings = JSON.parse(localStorage.getItem('courseBookings')) || [];
            bookingsTableBody.innerHTML = ''; // Clear existing rows

            if (bookings.length === 0) {
                bookingsTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px;">No bookings found.</td></tr>';
                return;
            }

            bookings.forEach(booking => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${booking.fullName}</td>
                    <td>${booking.phone}</td>
                    <td>${booking.email}</td>
                    <td>${booking.selectedCourse}</td>
                    <td>${booking.transactionId}</td>
                    <td><img src="${booking.courseImage}" alt="Transaction" class="transaction-image"></td>
                `;
                bookingsTableBody.appendChild(row);
            });
        }

        function loadStudents() {
            const students = JSON.parse(localStorage.getItem('registeredStudents')) || [];
            studentsTableBody.innerHTML = ''; // Clear existing rows

            if (students.length === 0) {
                studentsTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px;">No students registered yet.</td></tr>';
                return;
            }

            students.forEach((student, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${student.username}</td>
                    <td>${student.phone}</td>
                    <td>${student.email}</td>
                    <td>${student.password}</td>
                    <td>
                        <button class="action-btn edit-btn" data-index="${index}">Edit</button>
                        <button class="action-btn delete-btn" data-index="${index}">Delete</button>
                    </td>
                `;
                studentsTableBody.appendChild(row);
            });
            
            attachStudentActionListeners();
        }

        function attachStudentActionListeners() {
            const editBtns = document.querySelectorAll('.edit-btn');
            const deleteBtns = document.querySelectorAll('.delete-btn');

            editBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = e.target.getAttribute('data-index');
                    const students = JSON.parse(localStorage.getItem('registeredStudents')) || [];
                    const student = students[index];
                    
                    const newUsername = prompt('Edit Username:', student.username);
                    if (newUsername === null) return;
                    
                    const newPhone = prompt('Edit Phone (+91...):', student.phone);
                    if (newPhone === null) return;
                    
                    const newEmail = prompt('Edit Email:', student.email);
                    if (newEmail === null) return;
                    
                    const newPassword = prompt('Edit Password (4-digit):', student.password);
                    if (newPassword === null) return;

                    students[index] = {
                        username: newUsername,
                        phone: newPhone,
                        email: newEmail,
                        password: newPassword
                    };
                    
                    localStorage.setItem('registeredStudents', JSON.stringify(students));
                    loadStudents();
                });
            });

            deleteBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = e.target.getAttribute('data-index');
                    const students = JSON.parse(localStorage.getItem('registeredStudents')) || [];
                    
                    if (confirm('Are you sure you want to delete this student?')) {
                        students.splice(index, 1);
                        localStorage.setItem('registeredStudents', JSON.stringify(students));
                        loadStudents();
                    }
                });
            });
        }

        const downloadExcelBtn = document.getElementById('downloadExcelBtn');
        if (downloadExcelBtn) {
            downloadExcelBtn.addEventListener('click', () => {
                const students = JSON.parse(localStorage.getItem('registeredStudents')) || [];
                if (students.length === 0) {
                    alert('No student data to download.');
                    return;
                }
                
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += "Username,Phone,Email,Password\n"; // Header row
                
                students.forEach(function(student) {
                    const row = `${student.username},${student.phone},${student.email},${student.password}`;
                    csvContent += row + "\r\n";
                });
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "registered_students.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }

        if (clearBookingsBtn) {
            clearBookingsBtn.addEventListener('click', () => {
                if (confirm('Are you sure you want to delete all booking records? This action cannot be undone.')) {
                    localStorage.removeItem('courseBookings');
                    loadBookings(); // Refresh the table
                }
            });
        }

        if (clearStudentsBtn) {
            clearStudentsBtn.addEventListener('click', () => {
                if (confirm('Are you sure you want to delete all student records? This action cannot be undone.')) {
                    localStorage.removeItem('registeredStudents');
                    loadStudents(); // Refresh the table
                }
            });
        }

        loadBookings();
        loadStudents();
    });
    </script>
</body>
</html>
